---
layout: none
---

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Works</title>
  <meta name="description" content="Works Collection">
  <meta name="theme-color" content="#f8f7f3">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Works">
  <meta property="og:description" content="Works Collection">
  <meta property="og:url" content="https://works.indexmod.press/">
  <meta property="og:image" content="https://works.indexmod.press/images/works-cover.webp">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Works">
  <meta name="twitter:description" content="Works Collection">
  <meta name="twitter:image" content="https://works.indexmod.press/images/works-cover.webp">

  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='black'/%3E%3Ccircle cx='11' cy='13' r='2' fill='white'/%3E%3Ccircle cx='21' cy='13' r='2' fill='white'/%3E%3Crect x='12' y='20' width='8' height='2' rx='1' fill='white'/%3E%3C/svg%3E">
</head>

<body>
  <section class="hero" aria-label="Works">
    <img class="hero-image" src="images/works-cover.webp" alt="Художник в домашней мастерской">
    <div class="hero-caption">
      <span>WORKS</span>
      <span>Коллекция работ</span>
    </div>
    <a class="scroll-cue" href="#collection" aria-label="Перейти к коллекции">↓</a>
  </section>

  <header class="site-header" id="collection-heading">
    <div class="site-title">Works</div>
    <div class="site-count">{{ site.works | size }}</div>
  </header>

  <main class="collection" id="collection" aria-labelledby="collection-heading">
    <div class="list">
      {% for work in site.works %}
        <article class="item">
          <div class="text">
            <div class="text-inner">
              <h2 class="title">{{ work.title }}</h2>
              {% if work.year %}<div class="meta">{{ work.year }}</div>{% endif %}
              {% if work.size %}<div class="meta">{{ work.size }}</div>{% endif %}
              {% if work.materials %}<div class="meta">{{ work.materials }}</div>{% endif %}
            </div>
          </div>

          <figure class="image">
            <img
              src="images/{{ work.image }}.webp?v={{ site.time | date: '%s' }}"
              alt="{{ work.title }}{% if work.year %}, {{ work.year }}{% endif %}"
              {% if forloop.first %}fetchpriority="high"{% else %}loading="lazy"{% endif %}
              decoding="async">
          </figure>
        </article>
      {% endfor %}
    </div>

    <footer class="footer">
      <div class="qr">
        <img src="images/qr.png?v={{ site.time | date: '%s' }}" alt="QR-код сайта Works" loading="lazy" decoding="async">
      </div>
    </footer>
  </main>

  <script>
    const hero = document.querySelector('.hero');
    let ticking = false;

    function updateHero() {
      const distance = Math.max(1, hero.offsetHeight);
      const progress = Math.min(1, Math.max(0, window.scrollY / distance));
      hero.style.setProperty('--hero-progress', progress);
      ticking = false;
    }

    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(updateHero);
        ticking = true;
      }
    }, { passive: true });
    updateHero();
  </script>
</body>
</html>
